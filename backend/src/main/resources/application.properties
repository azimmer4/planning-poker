quarkus.http.port=8080
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Database (dev/test: Quarkus Dev Services starts PostgreSQL automatically)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/poker}
%prod.quarkus.datasource.username=${DB_USER:poker}
%prod.quarkus.datasource.password=${DB_PASSWORD:poker}

# GitLab
gitlab.base-url=${GITLAB_BASE_URL:https://gitlab.com}
gitlab.token=${GITLAB_TOKEN:}
quarkus.rest-client.gitlab.url=${gitlab.base-url}/api/v4
quarkus.rest-client.gitlab.connect-timeout=3000
quarkus.rest-client.gitlab.read-timeout=10000

# Real-time (SSE)
poker.sse.heartbeat-interval=15s
%test.poker.sse.heartbeat-interval=1s
